# Test of step 10 of bin/check.sh: the entry of inventory@v1 has decorators;
# an entry of apis may have only root and rules.
# expect: has the key decorators

extends: [recommended]
plugins: [./lint/plugin.js]
telemetry: off

apis:
  common@v1:
    root: openapi/common.v1.yaml
    rules:
      # The document has only components: no servers, no operations, and its
      # components are used by the other documents.
      no-empty-servers: off
      no-unused-components: off
      security-defined: off
  inventory@v1:
    root: openapi/inventory.v1.yaml
    decorators:
      remove-x-internal: on
  inventory-internal@v1:
    root: openapi/inventory-internal.v1.yaml
  booking@v1:
    root: openapi/booking.v1.yaml
  channel-sync@v1:
    root: openapi/channel-sync.v1.yaml
  channel-stub@v1:
    root: openapi/channel-stub.v1.yaml
    rules:
      # The API of an external system that the channel stubs implement. It has
      # neither our front nor our gateway, so the responses they add, their
      # media types and the shape of our 401 do not apply; errors of the stub
      # have no body. Every other rule applies.
      rule/public-response-set: off
      contracts/error-media-types: off
      contracts/unauthorized-shape: off
  events@v1:
    root: asyncapi/events.v1.yaml

rules:
  contracts/string-limit: error
