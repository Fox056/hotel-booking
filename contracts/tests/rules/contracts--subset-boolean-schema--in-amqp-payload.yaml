# The payload of a message is the schema true, which admits any value. The
# channel stays outside Kafka, so the rules of events skip it; the rule sees
# the payload from the message, its parent.
# also-fires: struct
asyncapi: 3.0.0
info:
  title: Fixture contracts--subset-boolean-schema--in-amqp-payload
  version: 1.0.0
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq.hotel-booking.test:5672
    protocol: amqp
    security:
      - $ref: '#/components/securitySchemes/rabbitmqUser'
channels:
  refund:
    address: payment.refund
    messages:
      refundRequested:
        $ref: '#/components/messages/refundRequested'
operations:
  sendRefund:
    action: send
    channel:
      $ref: '#/channels/refund'
    messages:
      - $ref: '#/channels/refund/messages/refundRequested'
    x-service: booking
components:
  messages:
    refundRequested:
      name: payment.refund.v1
      payload: true
  securitySchemes:
    rabbitmqUser:
      type: userPassword
      description: RabbitMQ user and password of the service.
