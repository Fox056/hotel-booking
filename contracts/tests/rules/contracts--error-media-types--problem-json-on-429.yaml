# A public 429 response in application/problem+json: the gateway answers in plain
# text. No Problem Details type is defined for 429, so that rule fires too.
# also-fires: contracts/problem-type-by-code
openapi: 3.1.0
info:
  title: Fixture contracts--error-media-types--problem-json-on-429
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/hotels/{hotel_id}/search:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    get:
      operationId: searchAvailability
      summary: Search availability
      security: []
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              $ref: '../openapi/common.v1.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/problem-details.v1.json#/$defs/about_blank'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  schemas:
    Result:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
      additionalProperties: false
