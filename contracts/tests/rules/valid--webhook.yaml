# Control fixture: correct webhooks of a channel, a booking and a
# cancellation. Both are POST under /v1/channels/{channel_id}/hotels/{hotel_id}/,
# secured by channelApiKey alone, with the required signature headers
# X-Timestamp and X-Signature and no query parameters. Their bodies are open at
# every level, nested objects and array items included, and the body of the
# booking carries personal data. Success is 202 without a body, and there is no
# 429: the gateway does not limit webhooks. The body of each webhook has exactly
# the fields of its list in contracts/webhook-fields, through nested schemas and
# array items. The booking webhook takes the signature headers from the
# parameters of its path, the cancellation webhook from those of its operation.
# No rule may report anything here.
openapi: 3.1.0
info:
  title: Control fixture, webhooks of a channel
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/channels/{channel_id}/hotels/{hotel_id}/bookings:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/ChannelId'
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XSignature'
    post:
      operationId: receiveChannelBooking
      summary: Receive a booking of a channel
      security:
        - channelApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelBooking'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../openapi/common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi/common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '413':
          $ref: '../openapi/common.v1.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '415':
          $ref: '../openapi/common.v1.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../openapi/common.v1.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
  /v1/channels/{channel_id}/hotels/{hotel_id}/cancellations:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/ChannelId'
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    post:
      operationId: receiveChannelCancellation
      summary: Receive a cancellation of a channel
      security:
        - channelApiKey: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCancellation'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../openapi/common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi/common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '413':
          $ref: '../openapi/common.v1.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '415':
          $ref: '../openapi/common.v1.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../openapi/common.v1.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    channelApiKey:
      $ref: '../openapi/common.v1.yaml#/components/securitySchemes/channelApiKey'
  parameters:
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        maxLength: 10
        pattern: '^[0-9]{10}(?![\s\S])'
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        maxLength: 67
        pattern: '^v1=[0-9a-f]{64}(?![\s\S])'
  schemas:
    ChannelBooking:
      type: object
      required: [external_id, room_types, check_in_date, check_out_date]
      properties:
        external_id:
          type: string
          maxLength: 128
        room_types:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [room_type_code, rooms]
            properties:
              room_type_code:
                type: string
                maxLength: 64
              rooms:
                type: integer
                minimum: 1
                maximum: 1000
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
          maximum: 20000
        guest:
          $ref: '#/components/schemas/ChannelGuest'
    ChannelGuest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 16
    ChannelCancellation:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          maxLength: 128
