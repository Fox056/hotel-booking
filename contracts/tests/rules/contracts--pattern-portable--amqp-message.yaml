# A pattern in the payload of a message uses \s outside the class [\s\S]:
# PCRE passes NEL as white space, ECMA-262 does not. The rule applies to the
# schemas of AsyncAPI documents as well; the channel stays outside Kafka, so
# the rules of events skip it.
asyncapi: 3.0.0
info:
  title: Fixture contracts--pattern-portable--amqp-message
  version: 1.0.0
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq.hotel-booking.test:5672
    protocol: amqp
    security:
      - $ref: '#/components/securitySchemes/rabbitmqUser'
channels:
  refund:
    address: payment.refund
    messages:
      refundRequested:
        $ref: '#/components/messages/refundRequested'
operations:
  sendRefund:
    action: send
    channel:
      $ref: '#/channels/refund'
    messages:
      - $ref: '#/channels/refund/messages/refundRequested'
    x-service: booking
components:
  schemas:
    RefundCommand:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 21
          pattern: '^[a-z]{1,10}\s[a-z]{1,10}(?![\s\S])'
  messages:
    refundRequested:
      name: payment.refund.v1
      payload:
        $ref: '#/components/schemas/RefundCommand'
  securitySchemes:
    rabbitmqUser:
      type: userPassword
      description: RabbitMQ user and password of the service.
