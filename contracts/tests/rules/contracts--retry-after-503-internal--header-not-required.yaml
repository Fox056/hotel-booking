# Retry-After of an internal 503 response is not required.
openapi: 3.1.0
info:
  title: Fixture contracts--retry-after-503-internal--header-not-required
  version: 1.0.0
servers:
  - url: http://inventory.hotel-booking.test
paths:
  /internal/v1/hotels/{hotel_id}/bookings/{booking_id}/hold:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
      - $ref: '../openapi/common.v1.yaml#/components/parameters/BookingId'
    put:
      operationId: holdRooms
      summary: Hold rooms
      x-callers: [booking]
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: Held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldSnapshot'
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../openapi/common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi/common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/HotelNotFound'
        '413':
          $ref: '../openapi/common.v1.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '415':
          $ref: '../openapi/common.v1.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGatewayInternal'
        '503':
          description: Unavailable.
          headers:
            Retry-After:
              $ref: '../openapi/common.v1.yaml#/components/headers/RetryAfterOptional'
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/problem-details.v1.json#/$defs/about_blank_traced'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeoutInternal'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HoldRequest:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: integer
          minimum: 1
          maximum: 5
    HoldSnapshot:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 15000000000
      additionalProperties: false
