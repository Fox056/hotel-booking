# The guest of the booking webhook is a oneOf of two open branches, and only
# the second lists middle_name: a field of one branch is a field of the body
# too. The booking webhook is in allowedRequests, so a name of personal data
# passes there: only the allowed list catches guest.middle_name.
openapi: 3.1.0
info:
  title: Fixture contracts--request-fields--field-in-one-of-branch
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/channels/{channel_id}/hotels/{hotel_id}/bookings:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/ChannelId'
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
      - $ref: '#/components/parameters/XTimestamp'
      - $ref: '#/components/parameters/XSignature'
    post:
      operationId: receiveChannelBooking
      summary: Receive a booking of a channel
      security:
        - channelApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelBooking'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../openapi/common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi/common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '413':
          $ref: '../openapi/common.v1.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '415':
          $ref: '../openapi/common.v1.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../openapi/common.v1.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    channelApiKey:
      $ref: '../openapi/common.v1.yaml#/components/securitySchemes/channelApiKey'
  parameters:
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        maxLength: 10
        pattern: '^[0-9]{10}(?![\s\S])'
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        maxLength: 67
        pattern: '^v1=[0-9a-f]{64}(?![\s\S])'
  schemas:
    ChannelBooking:
      type: object
      required: [external_id, room_types, check_in_date, check_out_date]
      properties:
        external_id:
          type: string
          maxLength: 128
        room_types:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [room_type_code, rooms]
            properties:
              room_type_code:
                type: string
                maxLength: 64
              rooms:
                type: integer
                minimum: 1
                maximum: 1000
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
          maximum: 20000
        guest:
          $ref: '#/components/schemas/ChannelGuest'
    ChannelGuest:
      type: object
      oneOf:
        - type: object
          required: [first_name, last_name]
          properties:
            first_name:
              type: string
              maxLength: 100
            last_name:
              type: string
              maxLength: 100
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              maxLength: 16
        - type: object
          required: [email]
          properties:
            first_name:
              type: string
              maxLength: 100
            middle_name:
              type: string
              maxLength: 100
            last_name:
              type: string
              maxLength: 100
            email:
              type: string
              format: email
              maxLength: 254
            phone:
              type: string
              maxLength: 16
