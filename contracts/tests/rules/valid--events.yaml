# Control fixture: Kafka topics of both kinds - booking.v1 is compacted, so
# its message carries the key version, payment.v1 has deletion only - with
# their messages and the send and receive operations. The common form of the
# envelope is referenced from components/schemas, as in the events document:
# the event rules check messages of Kafka channels, not every schema. No rule
# may report anything here.
asyncapi: 3.0.0
info:
  title: Control fixture, events
  version: 1.0.0
defaultContentType: application/json
servers:
  kafka:
    host: kafka.hotel-booking.test:9092
    protocol: kafka
    security:
      - $ref: '#/components/securitySchemes/scram'
channels:
  booking:
    address: booking.v1
    messages:
      bookingState:
        $ref: '#/components/messages/bookingState'
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          cleanup.policy: [compact, delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'
  payment:
    address: payment.v1
    messages:
      paymentCharged:
        $ref: '#/components/messages/paymentCharged'
    bindings:
      kafka:
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: '0.5.0'
operations:
  sendBookingState:
    action: send
    channel:
      $ref: '#/channels/booking'
    messages:
      - $ref: '#/channels/booking/messages/bookingState'
    x-service: booking
  receiveBookingState:
    action: receive
    channel:
      $ref: '#/channels/booking'
    messages:
      - $ref: '#/channels/booking/messages/bookingState'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [payment]
        bindingVersion: '0.5.0'
    x-service: payment
  sendPaymentCharged:
    action: send
    channel:
      $ref: '#/channels/payment'
    messages:
      - $ref: '#/channels/payment/messages/paymentCharged'
    x-service: payment
components:
  schemas:
    Envelope:
      $ref: '../schemas/envelope.v1.json#/$defs/Envelope'
  messages:
    bookingState:
      name: booking.state.v1
      payload:
        $ref: '../schemas/booking.v1.json#/$defs/booking.state.v1'
      bindings:
        kafka:
          key:
            $ref: '../schemas/booking.v1.json#/$defs/BookingKey'
          bindingVersion: '0.5.0'
    paymentCharged:
      name: payment.charged.v1
      payload:
        $ref: '../schemas/payment.v1.json#/$defs/payment.charged.v1'
      bindings:
        kafka:
          key:
            $ref: '../schemas/payment.v1.json#/$defs/PaymentKey'
          bindingVersion: '0.5.0'
  securitySchemes:
    scram:
      type: scramSha512
      description: SASL/SCRAM-SHA-512 credentials of the service.
