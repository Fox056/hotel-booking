# The address of the topic has a parameter, the guest. A topic per guest would
# put personal data into the name of the topic, which brokers log and metrics
# carry as a label.
asyncapi: 3.0.0
info:
  title: Fixture contracts--event-envelope--address-with-parameter
  version: 1.0.0
defaultContentType: application/json
servers:
  kafka:
    host: kafka.hotel-booking.test:9092
    protocol: kafka
    security:
      - $ref: '#/components/securitySchemes/scram'
channels:
  booking:
    address: booking.{guest}.v1
    parameters:
      guest:
        description: The guest of the booking.
    messages:
      bookingState:
        $ref: '#/components/messages/bookingState'
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          cleanup.policy: [compact, delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'
operations:
  sendBookingState:
    action: send
    channel:
      $ref: '#/channels/booking'
    messages:
      - $ref: '#/channels/booking/messages/bookingState'
    x-service: booking
components:
  messages:
    bookingState:
      name: booking.state.v1
      payload:
        $ref: '../schemas/booking.v1.json#/$defs/booking.state.v1'
      bindings:
        kafka:
          key:
            $ref: '../schemas/booking.v1.json#/$defs/BookingKey'
          bindingVersion: '0.5.0'
  securitySchemes:
    scram:
      type: scramSha512
      description: SASL/SCRAM-SHA-512 credentials of the service.
