# Personal data, email, in a channel whose only server uses amqp but which has
# a Kafka binding: a topic in disguise. The binding keeps the rules of events
# on; contracts/event-envelope reports the missing key of the message.
# also-fires: contracts/event-envelope
asyncapi: 3.0.0
info:
  title: Fixture contracts--event-fields--amqp-channel-with-kafka-binding
  version: 1.0.0
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq.hotel-booking.test:5672
    protocol: amqp
    security:
      - $ref: '#/components/securitySchemes/rabbitmqUser'
channels:
  booking:
    address: booking.v1
    messages:
      bookingState:
        $ref: '#/components/messages/bookingState'
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          cleanup.policy: [compact, delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'
operations:
  sendBookingState:
    action: send
    channel:
      $ref: '#/channels/booking'
    messages:
      - $ref: '#/channels/booking/messages/bookingState'
    x-service: booking
components:
  messages:
    bookingState:
      name: booking.state.v1
      payload:
        $ref: '../schemas/booking.v1.json#/$defs/MessageWithPersonalDataField'
  securitySchemes:
    rabbitmqUser:
      type: userPassword
      description: RabbitMQ user and password of the service.
