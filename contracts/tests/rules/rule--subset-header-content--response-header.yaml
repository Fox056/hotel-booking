# A response header is described by content instead of schema.
# contracts/pii-placement and contracts/response-closed look only at the schema
# of a header: the email field in this one passes the first, and the second
# would not see an open object here. The subset forbids content in headers, as
# in parameters.
openapi: 3.1.0
info:
  title: Fixture rule--subset-header-content--response-header
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/hotels/{hotel_id}/search:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    get:
      operationId: searchAvailability
      summary: Search availability
      security: []
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
          headers:
            X-Summary:
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                        maxLength: 254
                    additionalProperties: false
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '429':
          $ref: '../openapi/common.v1.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  schemas:
    Result:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
      additionalProperties: false
