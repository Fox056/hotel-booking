# A pattern with a Unicode property other than \p{L} and \p{M}, here \p{Lu}.
# The two engines name properties differently: \p{Latin} compiles in PCRE and
# not in ECMA-262. Only \p{L} and \p{M}, as in PersonName, stay allowed; \P{...}
# is refused as well.
openapi: 3.1.0
info:
  title: Fixture contracts--pattern-portable--property-escape
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/hotels/{hotel_id}/search:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    get:
      operationId: searchAvailability
      summary: Search availability
      security: []
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '429':
          $ref: '../openapi/common.v1.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  schemas:
    Result:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
          pattern: '^\p{Lu}[a-z]{0,49}(?![\s\S])'
      additionalProperties: false
