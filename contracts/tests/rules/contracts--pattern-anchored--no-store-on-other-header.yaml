# The exact pattern of CacheControlNoStore on a response header other than
# Cache-Control. The pattern finds no-store anywhere in a list of directives and
# holds neither end of the value, so a Location with no-store somewhere in it
# would pass. The exception is only for the schema of a Cache-Control response
# header.
openapi: 3.1.0
info:
  title: Fixture contracts--pattern-anchored--no-store-on-other-header
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/hotels/{hotel_id}/search:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    get:
      operationId: searchAvailability
      summary: Search availability
      security: []
      responses:
        '200':
          description: Offers.
          headers:
            Location:
              required: true
              schema:
                type: string
                maxLength: 200
                pattern: '(?:^|,)[ \t]*no-store[ \t]*(?:,|(?![\s\S]))'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '429':
          $ref: '../openapi/common.v1.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  schemas:
    Result:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
      additionalProperties: false
