# The Cache-Control header of a response has the pattern of a list of
# directives with public instead of no-store. It finds public anywhere in the
# list and holds neither end of the value, so any other directives pass with
# it. Only the exact pattern of CacheControlNoStore may do that. no-store is
# not required on this response - no 201 of booking creation, no bookingToken,
# no personal data in the body - so contracts/no-store-cache-control is silent.
openapi: 3.1.0
info:
  title: Fixture contracts--pattern-anchored--directive-list-not-no-store
  version: 1.0.0
servers:
  - url: https://api.hotel-booking.test
paths:
  /v1/hotels/{hotel_id}/search:
    parameters:
      - $ref: '../openapi/common.v1.yaml#/components/parameters/HotelId'
    get:
      operationId: searchAvailability
      summary: Search availability
      security: []
      responses:
        '200':
          description: Offers.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                maxLength: 200
                pattern: '(?:^|,)[ \t]*public[ \t]*(?:,|(?![\s\S]))'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../openapi/common.v1.yaml#/components/responses/NotFound'
        '414':
          $ref: '../openapi/common.v1.yaml#/components/responses/UriTooLong'
        '429':
          $ref: '../openapi/common.v1.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../openapi/common.v1.yaml#/components/responses/InternalServerError'
        '502':
          $ref: '../openapi/common.v1.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../openapi/common.v1.yaml#/components/responses/ServiceUnavailable'
        '504':
          $ref: '../openapi/common.v1.yaml#/components/responses/GatewayTimeout'
components:
  schemas:
    Result:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
      additionalProperties: false
