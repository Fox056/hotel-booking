asyncapi: 3.0.0
info:
  title: Hotel Booking events
  version: 1.0.0
defaultContentType: application/json

channels:
  booking.v1:
    address: booking.v1
    title: Bookings
    messages:
      booking.state.v1:
        name: booking.state.v1
        payload:
          $ref: '../schemas/booking.v1.json#/$defs/booking.state.v1'
        bindings:
          kafka:
            key:
              $ref: '../schemas/booking.v1.json#/$defs/BookingKey'
            bindingVersion: '0.5.0'
      booking.cancelled.v1:
        name: booking.cancelled.v1
        payload:
          $ref: '../schemas/booking.v1.json#/$defs/booking.cancelled.v1'
        bindings:
          kafka:
            key:
              $ref: '../schemas/booking.v1.json#/$defs/BookingKey'
            bindingVersion: '0.5.0'
    bindings:
      kafka:
        partitions: 6
        topicConfiguration:
          cleanup.policy: [compact, delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'

  becomes_compacted.v1:
    address: becomes_compacted.v1
    messages:
      sample.state.v1:
        name: sample.state.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
      sample.removed.v1:
        name: sample.removed.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
    bindings:
      kafka:
        partitions: 3
        topicConfiguration:
          cleanup.policy: [compact, delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'

  stops_compaction.v1:
    address: stops_compaction.v1
    messages:
      sample.state.v1:
        name: sample.state.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
      sample.removed.v1:
        name: sample.removed.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
    bindings:
      kafka:
        partitions: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 34560000000
          min.compaction.lag.ms: 604800000
        bindingVersion: '0.5.0'

  policy_string.v1:
    address: policy_string.v1
    messages:
      sample.state.v1:
        name: sample.state.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
      sample.removed.v1:
        name: sample.removed.v1
        payload:
          $ref: '../schemas/sample.v1.json#/$defs/sample.state.v1'
    bindings:
      kafka:
        partitions: 3
        topicConfiguration:
          cleanup.policy: compact
          retention.ms: 34560000000
        bindingVersion: '0.5.0'
