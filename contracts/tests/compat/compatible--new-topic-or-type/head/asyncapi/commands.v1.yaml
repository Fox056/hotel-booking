asyncapi: 3.0.0
info:
  title: Hotel Booking commands
  version: 1.0.0
defaultContentType: application/json

channels:
  payment.charge:
    address: payment.charge
    title: Charge commands
    messages:
      payment.charge.v1:
        name: payment.charge.v1
        summary: Charge the amount of a booking.
